[project]
name = "electricity"
version = "1.0.0"
description = "北电智慧水电（bd.bdfairy.cn）多校电表查询：表号/房间直查余额与账单，免微信 OAuth"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "electricity contributors" }]
keywords = [
  "bdfairy",
  "electricity",
  "meter",
  "campus",
  "dormitory",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities",
]
dependencies = [
  "requests>=2.28.0",
]

[project.scripts]
bdfetch = "electricity.cli:main"

[project.urls]
Homepage = "https://github.com/example/electricity"
Documentation = "https://github.com/example/electricity#readme"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/electricity"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/requirements.txt",
]
